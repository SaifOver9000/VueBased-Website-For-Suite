# Clean-installs dependencies, runs the test suite with coverage, and builds, across supported Node versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The app (package.json + package-lock.json) lives in a subfolder, not the repo root
    defaults:
      run:
        working-directory: Suite-Directory-Vue

    strategy:
      matrix:
        # Must satisfy "engines" in package.json: ^22.18.0 || >=24.12.0
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: Suite-Directory-Vue/package-lock.json
    - run: npm ci
    # Runs Vitest with coverage; fails the job if coverage drops below the thresholds in vitest.config.js
    - run: npm run coverage
    - run: npm run build

    # Coverage is the same on every Node version, so publish it once
    - name: Add coverage summary to the job page
      if: always() && matrix.node-version == '24.x'
      run: |
        node -e '
          const t = require("./coverage/coverage-summary.json").total;
          const rows = ["statements", "branches", "functions", "lines"]
            .map(m => `| ${m} | ${t[m].pct}% | ${t[m].covered}/${t[m].total} |`);
          console.log(["## Test coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |", ...rows].join("\n"));
        ' >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      if: always() && matrix.node-version == '24.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Suite-Directory-Vue/coverage/
